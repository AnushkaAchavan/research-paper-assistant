<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="PaperMind: AI Research Paper Explainer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- decorative network nodes -->
  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" fill="none">
    <line x1="860" y1="70" x2="980" y2="140"/>
    <line x1="980" y1="140" x2="1090" y2="90"/>
    <line x1="980" y1="140" x2="940" y2="250"/>
    <line x1="940" y1="250" x2="1080" y2="230"/>
    <line x1="1090" y1="90" x2="1080" y2="230"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.35">
    <circle cx="860" cy="70" r="7"/>
    <circle cx="1090" cy="90" r="9"/>
    <circle cx="940" cy="250" r="8"/>
    <circle cx="1080" cy="230" r="7"/>
  </g>
  <circle cx="980" cy="140" r="14" fill="url(#accent)"/>

  <!-- paper icon -->
  <g transform="translate(90 85)">
    <rect x="0" y="0" width="110" height="140" rx="12" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M78 0 L110 32 L78 32 Z" fill="#c7d2fe"/>
    <rect x="18" y="52" width="74" height="8" rx="4" fill="#6366f1"/>
    <rect x="18" y="72" width="60" height="8" rx="4" fill="#a5b4fc"/>
    <rect x="18" y="92" width="68" height="8" rx="4" fill="#a5b4fc"/>
    <rect x="18" y="112" width="40" height="8" rx="4" fill="#a5b4fc"/>
  </g>

  <!-- text -->
  <text x="240" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff">PaperMind</text>
  <rect x="244" y="168" width="150" height="6" rx="3" fill="url(#accent)"/>
  <text x="242" y="215" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#e0e7ff">AI Research Paper Explainer</text>
  <text x="242" y="256" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#c7d2fe" fill-opacity="0.9">Ask questions. Compare papers. Get cited answers.</text>
</svg>
